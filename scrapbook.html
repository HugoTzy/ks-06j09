<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>our scrapbook</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=DM+Sans:wght@400;500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="scrapbook" data-theme="night">
<main>
  <h1 class="page-title">our little scrapbook</h1>
  <p class="page-sub">ldr edition. tap a photo to see it bigger.</p>

  <section class="wall">
    <figure class="polaroid" tabindex="0" role="button" data-cap="video call natin sa perth"><div class="ph"><img src="assets/scrapbook/call1.jpg" alt="video call natin sa perth" onerror="this.remove()"></div><figcaption>video call natin sa perth</figcaption></figure>
    <figure class="polaroid" tabindex="0" role="button" data-cap="first virtual date"><div class="ph"><img src="assets/scrapbook/call2.jpg" alt="first virtual date" onerror="this.remove()"></div><figcaption>first virtual date</figcaption></figure>
    <figure class="polaroid" tabindex="0" role="button" data-cap="second virtual date"><div class="ph"><img src="assets/scrapbook/call3.jpg" alt="second virtual date" onerror="this.remove()"></div><figcaption>second virtual date</figcaption></figure>
    <figure class="polaroid" tabindex="0" role="button" data-cap="first face mask"><div class="ph"><img src="assets/scrapbook/call4.jpg" alt="first face mask" onerror="this.remove()"></div><figcaption>first face mask</figcaption></figure>
    <figure class="polaroid" tabindex="0" role="button" data-cap="first homecook dinner"><div class="ph"><img src="assets/scrapbook/visit1.jpg" alt="first homecook dinner" onerror="this.remove()"></div><figcaption>first homecook dinner</figcaption></figure>
    <figure class="polaroid" tabindex="0" role="button" data-cap="nakatulog si milo"><div class="ph"><img src="assets/scrapbook/visit2.jpg" alt="nakatulog si milo" onerror="this.remove()"></div><figcaption>nakatulog si milo</figcaption></figure>
    <figure class="polaroid" tabindex="0" role="button" data-cap="favorite sleeping photo"><div class="ph"><img src="assets/scrapbook/visit3.jpg" alt="favorite sleeping photo" onerror="this.remove()"></div><figcaption>favorite sleeping photo</figcaption></figure>
    <figure class="polaroid" tabindex="0" role="button" data-cap="ligo ni daga"><div class="ph"><img src="assets/scrapbook/visit4.jpg" alt="ligo ni daga" onerror="this.remove()"></div><figcaption>ligo ni daga</figcaption></figure>
  </section>
</main>

<div class="lightbox" id="lb" hidden role="dialog" aria-label="Photo viewer">
  <figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
</div>

<script src="shared.js"></script>
<script>
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbCap = document.getElementById('lbCap');
function openPhoto(el) {
  const img = el.querySelector('img');
  if (!img) return;                       // no photo added yet
  lbImg.src = img.src; lbCap.textContent = el.dataset.cap; lb.hidden = false;
}
document.querySelectorAll('.polaroid').forEach(f => {
  f.addEventListener('click', () => openPhoto(f));
  f.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPhoto(f); } });
});
lb.addEventListener('click', () => lb.hidden = true);
addEventListener('keydown', e => { if (e.key === 'Escape') lb.hidden = true; });
</script>
</body>
</html>
